# GitHub Actions 发布编译流程
# Copyright (c) 2026 ant-cave (AGPL-3.0-or-later)
#
# 规则：
#   - 推送的 tag 包含 "alpha"（如 v1.0.0-alpha.1）-> 仅编译 armv8 (arm64-v8a) APK，发 Pre-release 测试版。
#   - 推送正式版 tag（不含 "alpha"，如 v1.0.0）-> 编译完整 APK（含全部架构），发正式 Release。
#
# 注意：使用仓库内置的 GITHUB_TOKEN 即可对本仓库创建 Release，无需额外 PAT。
# 切勿把任何个人访问令牌写进仓库或工作流明文。

name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze lib

      # 判断是否 alpha：tag 中含 "alpha" 则只编译 armv8，否则编译完整 APK
      - name: 设置编译参数
        id: cfg
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qi "alpha"; then
            echo "target=android-arm64" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "artifact=app-arm64-v8a-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "target=android-arm64,android-armeabi-v7a,android-x64" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "artifact=app-release.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译 APK
        run: flutter build apk --target-platform ${{ steps.cfg.outputs.target }} --release

      - name: 重命名产物
        run: |
          if echo "${{ steps.cfg.outputs.target }}" | grep -q "android-arm64"; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/app/outputs/flutter-apk/${{ steps.cfg.outputs.artifact }}"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ steps.cfg.outputs.artifact }}"
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.cfg.outputs.prerelease }}
          files: build/app/outputs/flutter-apk/${{ steps.cfg.outputs.artifact }}
          name: ClearScan ${{ steps.cfg.outputs.tag }}
          tag_name: ${{ steps.cfg.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
